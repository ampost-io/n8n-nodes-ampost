# Publishes to npm with a provenance statement when a version tag (0.1.0, 1.2.3, ...) is pushed.
# n8n verifies only community nodes published from GitHub Actions with provenance (since 2026-05-01).
#
# Disabled until the repo has moved and the npm package exists: set the repository variable
# NPM_PUBLISH_ENABLED to "true", and either configure npm trusted publishing for this workflow
# (no secret) or add the NPM_TOKEN secret (a granular token for this package).
#
# Release: run `npm run release` locally. It lints, builds, bumps the version, updates the
# changelog, commits, tags and pushes; the tag starts this workflow.
name: Publish to npm

on:
  push:
    tags: ['*.*.*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: vars.NPM_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Release with provenance
        run: |
          [ -n "$NPM_TOKEN" ] && npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          npm run release
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
