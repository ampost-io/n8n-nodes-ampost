# Stages a release on npm, with a provenance statement, when a v<version> tag is pushed. The ampost
# repo's mirror (scripts/mirror-public-repos.sh) pushes that tag when package.json gets a new version,
# so a release is a version bump committed in ampost's public-repos/. Run it by hand on a tag to retry.
#
# `npm stage publish` only queues the version: a maintainer approves it with 2FA on npmjs.com (or
# `npm stage approve <id>`) before anyone can install it. Auth is npm trusted publishing (OIDC), set
# to stage-only on npmjs.com, so a plain `npm publish` from here is refused. No token secret.
# Off until the repository variable NPM_PUBLISH_ENABLED is "true".
name: Publish to npm

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: vars.NPM_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: npm 11 (trusted publishing)
        run: npm install -g npm@11
      - name: The tag matches package.json and the version is not on npm yet
        id: version
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "::notice::$name@$version is already on npm"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.version.outputs.skip != 'true'
        run: npm ci
      - if: steps.version.outputs.skip != 'true'
        run: npm run lint
      - if: steps.version.outputs.skip != 'true'
        run: npm test
      - if: steps.version.outputs.skip != 'true'
        run: npm run build
      - if: steps.version.outputs.skip != 'true'
        run: npm stage publish --provenance --access public
        env:
          RELEASE_MODE: "true"

  # A GitHub Release for every version tag, so the repo shows its versions (GitHub SEO/GEO). Runs even
  # while publishing is off; the notes are GitHub's generated list of changes since the last tag.
  github-release:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes --verify-tag
